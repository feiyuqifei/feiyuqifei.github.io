<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 飞鱼 favicon：小尺寸下只保留最可辨识的轮廓 -->
  <rect width="32" height="32" rx="7" fill="#0f2027" />
  <g fill="none" stroke="#2dd4bf" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体 -->
    <path d="M4 18.5c4-6 9-8.8 15-8.8 2.3 0 4.1.5 5.6 1.5-1.1 1.2-1.8 2.4-2.2 3.6 1.3.3 2.5.9 3.6 1.8-2.8 1.6-6.1 2.4-10 2.4" />
    <!-- 背鳍 -->
    <path d="M13 10.2c.5-3.4 2-5.8 4.4-7.3.6 2.4.5 4.6-.3 6.5" />
    <!-- 尾鳍 -->
    <path d="M6.6 14.2c-1.9-1.4-3.1-3.1-3.7-5 2.5.4 4.5 1.3 5.9 2.8" />
  </g>
  <!-- 眼睛 -->
  <circle cx="21.5" cy="15.3" r="1.4" fill="#0f2027" />
  <!-- 水波 -->
  <path d="M4 25.5c2.4-1.7 4.8-1.7 7.2 0s4.8 1.7 7.2 0 4.8-1.7 7.2 0"
    fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.9" stroke-linecap="round" />
</svg>
